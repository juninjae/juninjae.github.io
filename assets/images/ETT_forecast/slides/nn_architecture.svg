<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hiddenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#424242" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="700" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a237e">
    Deep Neural Network Architecture
  </text>
  <text x="700" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#616161">
    Multi-Layer Perceptron for Time Series Regression
  </text>
  
  <!-- Input Layer -->
  <rect x="50" y="200" width="180" height="120" rx="8" fill="url(#inputGrad)" stroke="#1976D2" stroke-width="3"/>
  <text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Input Layer
  </text>
  <text x="140" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
    29 features
  </text>
  <text x="140" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E3F2FD">
    (batch_size, 29)
  </text>
  
  <!-- Arrow 1 -->
  <line x1="230" y1="260" x2="300" y2="260" stroke="#424242" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="265" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#424242">
    Linear
  </text>
  
  <!-- ReLU icon 1 -->
  <circle cx="265" cy="260" r="18" fill="#FFF59D" stroke="#F57F17" stroke-width="2"/>
  <text x="265" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    σ
  </text>
  
  <!-- Hidden Layer 1 -->
  <rect x="300" y="200" width="200" height="120" rx="8" fill="url(#hiddenGrad)" stroke="#558B2F" stroke-width="3"/>
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Hidden Layer 1
  </text>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
    256 neurons
  </text>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#E8F5E9">
    ReLU + Dropout(0.2)
  </text>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C5E1A5">
    (batch_size, 256)
  </text>
  
  <!-- Arrow 2 -->
  <line x1="500" y1="260" x2="570" y2="260" stroke="#424242" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="535" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#424242">
    Linear
  </text>
  
  <!-- ReLU icon 2 -->
  <circle cx="535" cy="260" r="18" fill="#FFF59D" stroke="#F57F17" stroke-width="2"/>
  <text x="535" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    σ
  </text>
  
  <!-- Hidden Layer 2 -->
  <rect x="570" y="200" width="200" height="120" rx="8" fill="url(#hiddenGrad)" stroke="#558B2F" stroke-width="3"/>
  <text x="670" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Hidden Layer 2
  </text>
  <text x="670" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
    128 neurons
  </text>
  <text x="670" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#E8F5E9">
    ReLU + Dropout(0.2)
  </text>
  <text x="670" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C5E1A5">
    (batch_size, 128)
  </text>
  
  <!-- Arrow 3 -->
  <line x1="770" y1="260" x2="840" y2="260" stroke="#424242" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="805" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#424242">
    Linear
  </text>
  
  <!-- ReLU icon 3 -->
  <circle cx="805" cy="260" r="18" fill="#FFF59D" stroke="#F57F17" stroke-width="2"/>
  <text x="805" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    σ
  </text>
  
  <!-- Hidden Layer 3 -->
  <rect x="840" y="200" width="200" height="120" rx="8" fill="url(#hiddenGrad)" stroke="#558B2F" stroke-width="3"/>
  <text x="940" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Hidden Layer 3
  </text>
  <text x="940" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
    64 neurons
  </text>
  <text x="940" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#E8F5E9">
    ReLU + Dropout(0.2)
  </text>
  <text x="940" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C5E1A5">
    (batch_size, 64)
  </text>
  
  <!-- Arrow 4 -->
  <line x1="1040" y1="260" x2="1110" y2="260" stroke="#424242" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1075" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#424242">
    Linear
  </text>
  
  <!-- Output Layer -->
  <rect x="1110" y="200" width="200" height="120" rx="8" fill="url(#outputGrad)" stroke="#E65100" stroke-width="3"/>
  <text x="1210" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Output Layer
  </text>
  <text x="1210" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
    1 neuron
  </text>
  <text x="1210" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFE0B2">
    (batch_size, 1)
  </text>
  
  <!-- Training Configuration Box -->
  <rect x="50" y="380" width="1310" height="280" rx="10" fill="white" stroke="#BDBDBD" stroke-width="2"/>
  <text x="700" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a237e">
    Training Configuration & Performance
  </text>
  
  <!-- Three columns layout -->
  <!-- Left Column - Optimization -->
  <rect x="80" y="445" width="380" height="190" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="270" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565C0">
    Optimization
  </text>
  <text x="100" y="505" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Optimizer: Adam
  </text>
  <text x="100" y="535" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Learning Rate: 0.001
  </text>
  <text x="100" y="565" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Weight Decay: 1e-5
  </text>
  <text x="100" y="595" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Betas: (0.9, 0.999)
  </text>
  
  <!-- Middle Column - Training -->
  <rect x="490" y="445" width="380" height="190" rx="8" fill="#E8F5E9" stroke="#558B2F" stroke-width="2"/>
  <text x="680" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
    Training Setup
  </text>
  <text x="510" y="505" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Loss Function: MSELoss
  </text>
  <text x="510" y="535" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Epochs: 50
  </text>
  <text x="510" y="565" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Batch Size: 256
  </text>
  <text x="510" y="595" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Dropout Rate: 0.2
  </text>
  
  <!-- Right Column - Regularization & Performance -->
  <rect x="900" y="445" width="430" height="190" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="1115" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    Scheduler & Performance
  </text>
  <text x="920" y="505" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Scheduler: ReduceLROnPlateau
  </text>
  <text x="920" y="535" font-family="Arial, sans-serif" font-size="14" fill="#424242">
    • Mode: min, Factor: 0.5, Patience: 5
  </text>
  <line x1="920" y1="555" x2="1310" y2="555" stroke="#E0E0E0" stroke-width="1"/>
  <text x="920" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">
    ✓ Train MSE: 0.3122
  </text>
  <text x="920" y="608" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    ✓ Test MSE: 0.1320
  </text>
  
  <!-- Legend -->
  <text x="50" y="680" font-family="Arial, sans-serif" font-size="12" fill="#757575">
    σ = ReLU activation function  |  Each layer includes Batch Normalization via Dropout
  </text>
</svg>