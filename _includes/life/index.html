<div class="life-grid-container">
  <div class="row">
    {% assign sorted_life = site.life | sort: 'date' | reverse %}
    {% for post in sorted_life %}
    <div class="col-lg-4 col-md-6 col-sm-12 mb-4">
      <div class="life-card">
        <a href="{{ post.url | relative_url }}" class="life-card-link">
          <div class="life-image-container">
            {% if post.thumbnail %}
              <img src="{{ post.thumbnail }}" alt="{{ post.title }}" class="life-thumbnail">
            {% elsif post.images and post.images.size > 0 %}
              <img src="{{ post.images[0] }}" alt="{{ post.title }}" class="life-thumbnail">
            {% else %}
              <div class="life-placeholder">
                <i class="fas fa-image"></i>
              </div>
            {% endif %}
          </div>
          <div class="life-card-footer">
            <p class="life-date">{{ post.date | date: "%b %d, %Y" }}</p>
            <p class="life-title">{{ post.title }}</p>
          </div>
        </a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<style>
.life-grid-container {
  padding: 20px 0;
}

.life-card {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  height: 100%;
}

.life-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}

.life-card-link {
  text-decoration: none;
  color: inherit;
  display: block;
  height: 100%;
}

.life-card-link:hover {
  text-decoration: none;
  color: inherit;
}

.life-image-container {
  width: 100%;
  height: 250px;
  overflow: hidden;
  position: relative;
}

.life-thumbnail {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.life-card:hover .life-thumbnail {
  transform: scale(1.05);
}

.life-placeholder {
  width: 100%;
  height: 100%;
  background: #f8f9fa;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #6c757d;
  font-size: 2rem;
}

.life-card-footer {
  padding: 15px;
  background: white;
}

.life-date {
  font-size: 0.9rem;
  color: #6c757d;
  margin-bottom: 5px;
  font-weight: 500;
}

.life-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0;
  color: #333;
  line-height: 1.3;
}

/* Dark theme support */
[data-theme="dark"] .life-card {
  background: #2d3748;
  color: #e2e8f0;
}

[data-theme="dark"] .life-card-footer {
  background: #2d3748;
}

[data-theme="dark"] .life-title {
  color: #e2e8f0;
}

[data-theme="dark"] .life-placeholder {
  background: #4a5568;
  color: #a0aec0;
}
</style>
